name: shopping-groups
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=db;Database=shopping;Username=shopping;Password=${POSTGRES_PASSWORD}
      PublicUrl: ${PUBLIC_URL:-http://localhost:8080}
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__From: ${SMTP_FROM:-shopping@localhost}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__EnableSsl: ${SMTP_SSL:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - protection_keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
volumes:
  postgres_data:
  protection_keys:
