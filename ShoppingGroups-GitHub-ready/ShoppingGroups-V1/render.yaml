# Free web hosting with an external Neon Free PostgreSQL database.
# No Render Postgres, persistent disk or paid service is provisioned here.
# Use this file as Blueprint Path: ShoppingGroups-V1/render.yaml
services:
  - type: web
    name: shopping-groups-test
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: ShoppingGroups-V1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'checksPass'
    # Avoid waking a sleeping database just to answer platform liveness probes.
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
      - key: PublicUrl
        fromService:
          name: shopping-groups-test
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Paste Neon's DIRECT (not pooled) connection URL into Render, never chat/GitHub.
      # Direct sessions are required by the maintenance worker's advisory lock.
      - key: DATABASE_URL
        sync: false
      - key: DataProtection__Storage
        value: Database
      - key: Maintenance__IntervalSeconds
        value: "900"
      - key: Bootstrap__AdminEmail
        sync: false
      - key: Bootstrap__AdminPassword
        sync: false
