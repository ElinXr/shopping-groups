services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PublicUrl: https://${DOMAIN:?Set DOMAIN}
      TrustedProxies: 172.30.42.10
    networks:
      default:
    # The development host port stays bound to 127.0.0.1 only.
  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        ipv4_address: 172.30.42.10
    depends_on:
      - api
    restart: unless-stopped
  mailpit:
    profiles: ["development-mail"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.42.0/24
volumes:
  caddy_data:
  caddy_config:
