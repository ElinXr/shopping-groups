name: shopping-groups-tests
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: shopping_tests
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: isolated-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping_tests"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: /var/lib/postgresql/data
  api:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__Database: Host=db;Database=shopping_tests;Username=shopping;Password=isolated-test-password
      PublicUrl: http://api:8080
      Smtp__Host: mailpit
      Smtp__Port: 1025
      Bootstrap__AdminEmail: admin@tests.example
      Bootstrap__AdminPassword: Integration_Admin_123!
    depends_on:
      db:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.27
  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /source
    volumes:
      - .:/source:ro
      - test_build:/tmp/test-build
    environment:
      TEST_BASE_URL: http://api:8080
      TEST_MAIL_URL: http://mailpit:8025
    command: ["dotnet", "run", "--project", "tests/ShoppingGroups.Api.Tests", "--artifacts-path", "/tmp/test-build"]
    depends_on:
      - api
      - mailpit
volumes:
  test_build:
